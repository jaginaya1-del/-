<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-title" content="차량일정">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>🚗 가족 차량·일정</title>
<style>
  :root{
    --ink:#1b2333; --muted:#6b7280; --line:#e5e9f2; --bg:#eef2f9; --card:#ffffff;
    --c-off:#10b981; --c-off-bg:#ecfdf5; --c-off-line:#a7f3d0;
    --c-late:#7c3aed; --c-late-bg:#f5f3ff; --c-late-line:#ddd6fe;
    --c-seongeun:#3b82f6; --c-seongeun-bg:#eff6ff; --c-seongeun-line:#bfdbfe;
    --c-jeongmin:#f59e0b; --c-jeongmin-bg:#fffbeb; --c-jeongmin-line:#fde68a;
    --warn:#e11d48; --warn-bg:#fff1f2; --ok:#059669;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:linear-gradient(180deg,#e8eefb 0%,#eef2f9 220px,#eef2f9 100%);
    color:var(--ink); font-size:14px; line-height:1.45; word-break:keep-all;
    padding-bottom:32px;
  }
  body.lock{overflow:hidden;}
  #app{max-width:440px; margin:0 auto; padding:10px 10px 26px;}

  /* ===== 상단 ===== */
  .hero{
    background:linear-gradient(135deg,#1d4ed8,#3b82f6 55%,#60a5fa);
    color:#fff; border-radius:20px; padding:14px 14px 12px;
    box-shadow:0 10px 24px rgba(29,78,216,.26);
  }
  .hero-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .hero h1{margin:0; font-size:17px; letter-spacing:-.3px; font-weight:800;}
  .conn{font-size:10.5px; background:rgba(255,255,255,.18); border-radius:999px; padding:3px 8px; white-space:nowrap;}
  .conn.live{background:rgba(16,185,129,.35);}
  .conn.poll{background:rgba(245,158,11,.4);}
  .conn.off{background:rgba(225,29,72,.45);}
  .role-row{display:flex; align-items:center; gap:8px; margin-top:11px;}
  .role-label{font-size:11px; opacity:.85; white-space:nowrap;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.14); color:#fff;
    font:inherit; font-size:12.5px; padding:5px 11px; border-radius:999px; cursor:pointer;
  }
  .chip.on{background:#fff; color:#1d4ed8; border-color:#fff; font-weight:700;}
  .legend{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:10px; font-size:10.5px; opacity:.95;}
  .lg{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .sw{width:9px; height:9px; border-radius:3px; display:inline-block;}
  .sw.off{background:#34d399;} .sw.late{background:#a78bfa;}
  .sw.seongeun{background:#93c5fd;} .sw.jeongmin{background:#fbbf24;}
  .sw.pickup{background:#fb7185;}

  /* ===== 카드 공통 ===== */
  .card{background:var(--card); border-radius:var(--radius); padding:12px; margin-top:10px; box-shadow:0 4px 14px rgba(27,35,51,.06);}

  /* ===== 달력 ===== */
  .cal-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .cal-head .month{font-size:15px; font-weight:800; flex:1; text-align:center;}
  .navbtn{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:#f8fafc;
    font-size:17px; line-height:1; color:#334155; cursor:pointer;
  }
  .today{
    height:32px; padding:0 10px; border-radius:10px; border:1px solid var(--line); background:#f8fafc;
    font:inherit; font-size:12px; font-weight:700; color:#1d4ed8; cursor:pointer;
  }
  .dows{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px;}
  .dows span{text-align:center; font-size:10.5px; color:var(--muted); font-weight:700;}
  .dows span:first-child{color:#ef4444;} .dows span:last-child{color:#2563eb;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:60px; gap:2px;}
  .cell{
    position:relative; border:1px solid transparent; background:#fbfcfe; border-radius:10px;
    height:100%; overflow:hidden; padding:4px 1px 3px; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:1px; cursor:pointer; font:inherit; color:var(--ink);
  }
  .cell .dnum{font-size:12px; font-weight:700; line-height:1.1;}
  .cell.other{opacity:.35;}
  .cell.today{background:#eff6ff; border-color:#bfdbfe;}
  .cell.today .dnum{color:#1d4ed8;}
  .cell.sel{background:#dbeafe; border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.25) inset;}
  .cell.sel .dnum{color:#1e40af;}
  .dots{display:flex; gap:2px; flex-wrap:wrap; justify-content:center; height:7px;}
  .dot{width:6px; height:6px; border-radius:50%; display:block;}
  .dot.off{background:var(--c-off);} .dot.late{background:var(--c-late);}
  .dot.seongeun{background:var(--c-seongeun);} .dot.jeongmin{background:var(--c-jeongmin);}
  .dot.pickup{background:#fb7185;}
  .cellflags{display:flex; flex-direction:column; align-items:center; gap:1px; min-height:12px;}
  .avail{font-size:7.5px; font-weight:800; color:#047857; background:#d1fae5; border-radius:4px; padding:0 2px; line-height:1.35; letter-spacing:-.3px; white-space:nowrap;}
  @media (max-width:380px){ .avail{font-size:7px; letter-spacing:-.5px; padding:0 1px;} }
  .cwarn{font-size:9px; line-height:1; color:var(--warn);}

  /* ===== 상세 ===== */
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .ddate{font-size:16px; font-weight:800; letter-spacing:-.3px;}
  .dsub{font-size:11px; color:var(--muted); margin-top:1px;}
  .dbadges{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px;}
  .badge.avail{background:#d1fae5; color:#047857; font-size:11px; padding:3px 9px;}
  .badge.conf{background:#fee2e2; color:#b91c1c;}
  .dact{display:flex; flex-direction:column; gap:6px;}
  .btn{
    font:inherit; font-size:12.5px; font-weight:700; padding:8px 11px; border-radius:11px;
    border:1px solid var(--line); background:#f8fafc; color:#1e293b; cursor:pointer; white-space:nowrap;
  }
  .btn.primary{background:#2563eb; border-color:#2563eb; color:#fff; box-shadow:0 4px 10px rgba(37,99,235,.28);}
  .btn.danger{background:#fff1f2; border-color:#fecdd3; color:#be123c;}
  .btn.wide{flex:1; padding:11px; font-size:13.5px;}
  .btn:disabled{opacity:.5;}

  .subhead{margin:14px 0 6px; font-size:12px; font-weight:800; color:#334155;}
  .list{display:flex; flex-direction:column; gap:8px;}
  .empty{font-size:12px; color:var(--muted); background:#f8fafc; border:1px dashed var(--line); border-radius:12px; padding:14px 10px; text-align:center;}

  .alert{
    display:flex; gap:7px; align-items:flex-start; background:var(--warn-bg); border:1.5px solid #fda4af;
    color:#9f1239; border-radius:12px; padding:9px 10px; font-size:11.5px; font-weight:700; margin-bottom:8px;
  }
  .alert .atitle{display:block; font-size:12px; margin-bottom:2px;}
  .alert .aline{display:block; font-weight:700; color:#be123c;}
  .alert .aline.sub{font-weight:600; padding-left:9px;}

  /* 일정 카드 */
  .scard{border:1.5px solid var(--line); border-radius:13px; padding:9px 10px; background:#fff; position:relative; overflow:hidden;}
  .scard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;}
  .scard.t-off{background:var(--c-off-bg); border-color:var(--c-off-line);} .scard.t-off::before{background:var(--c-off);}
  .scard.t-late{background:var(--c-late-bg); border-color:var(--c-late-line);} .scard.t-late::before{background:var(--c-late);}
  .scard.t-seongeun{background:var(--c-seongeun-bg); border-color:var(--c-seongeun-line);} .scard.t-seongeun::before{background:var(--c-seongeun);}
  .scard.t-jeongmin{background:var(--c-jeongmin-bg); border-color:var(--c-jeongmin-line);} .scard.t-jeongmin::before{background:var(--c-jeongmin);}
  .scard.requested{border-style:dashed; border-width:2px;}
  .scard.conflict{box-shadow:0 0 0 2px #fecdd3, 0 2px 8px rgba(225,29,72,.16); border-color:#fb7185;}
  .sc-row1{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .sc-title{font-size:13px; font-weight:800; letter-spacing:-.2px;}
  .tags{display:flex; gap:4px; flex-wrap:wrap; margin-left:auto;}
  .tag{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:6px; background:#eef2f7; color:#475569; white-space:nowrap;}
  .tag.car{background:#e0e7ff; color:#3730a3;}
  .tag.ok{background:#d1fae5; color:#047857;}
  .tag.req{background:#fff7ed; color:#b45309; border:1px dashed #f59e0b;}
  .tag.bad{background:#fee2e2; color:#b91c1c;}
  .tag.moved{background:#ede9fe; color:#5b21b6;}
  .tag.rep{background:#eef2ff; color:#4338ca;}
  .sc-meta{font-size:11.5px; color:#475569; margin-top:3px; font-weight:600;}
  .sc-note{font-size:11.5px; color:#334155; margin-top:3px; background:rgba(255,255,255,.7); border-radius:8px; padding:3px 7px;}
  .sc-act{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .mini{
    font:inherit; font-size:11px; font-weight:700; padding:5px 8px; border-radius:8px;
    border:1px solid #cbd5e1; background:#fff; color:#334155; cursor:pointer;
  }
  .mini.go{background:#2563eb; border-color:#2563eb; color:#fff;}
  .mini.on{background:#059669; border-color:#059669; color:#fff;}
  .mini.danger{color:#be123c; border-color:#fecdd3; background:#fff1f2;}

  /* 픽업 카드 */
  .pcard{border:1.5px solid #e2e8f0; border-radius:13px; padding:9px 10px 9px 12px; background:#fff; position:relative; overflow:hidden;}
  .pcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:#cbd5e1;}
  .pcard.who-jeongmin::before{background:var(--c-jeongmin);}
  .pcard.who-haseon::before{background:#ec4899;}
  .pcard.who-junseo::before{background:#0891b2;}
  .pcard.done{background:#f0fdf4; border-color:#bbf7d0;}
  .p-row1{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; font-weight:800;}
  .p-time{color:#0f172a;}
  .p-who{font-size:10px; font-weight:800; color:#64748b; background:#f1f5f9; border-radius:6px; padding:2px 7px; border:1px solid #e2e8f0;}
  .p-who.who-jeongmin{background:#fffbeb; color:#b45309; border-color:#fde68a;}
  .p-who.who-haseon{background:#fdf2f8; color:#be185d; border-color:#fbcfe8;}
  .p-who.who-junseo{background:#ecfeff; color:#0e7490; border-color:#a5f3fc;}
  .p-state{font-size:10px; font-weight:800; border-radius:6px; padding:2px 7px; margin-left:auto;}
  .p-state.pending{background:#fff7ed; color:#b45309; border:1px dashed #f59e0b;}
  .p-state.accepted{background:#dcfce7; color:#15803d;}
  .p-place{font-size:12px; color:#334155; margin-top:3px; font-weight:600;}
  .p-note{font-size:11.5px; color:#475569; margin-top:2px;}
  .p-tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:4px;}

  /* ===== 모달 ===== */
  .modal{position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;}
  .modal.hidden{display:none;}
  .sheet{
    width:100%; max-width:440px; background:#fff; border-radius:22px 22px 0 0; padding:14px 14px 18px;
    max-height:92vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(15,23,42,.3); animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(24px); opacity:.6;} to{transform:none; opacity:1;}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .sheet-head b{font-size:15px;}
  .x{border:0; background:#f1f5f9; width:30px; height:30px; border-radius:50%; font-size:14px; color:#475569; cursor:pointer;}
  .flabel{display:block; font-size:11.5px; font-weight:800; color:#475569; margin:11px 0 5px;}
  .inp{
    width:100%; font:inherit; font-size:16px; padding:9px 10px; border:1.5px solid var(--line);
    border-radius:11px; background:#fbfcfe; color:var(--ink);
  }
  .inp.small{width:70px; display:inline-block;}
  textarea.inp{font-size:14px; resize:vertical;}
  .row{display:flex; align-items:center; gap:8px;}
  .times{gap:6px; align-items:center;}
  .times .inp{flex:1;}
  .chk{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#334155; padding:6px 0;}
  .chk input{width:18px; height:18px; accent-color:#2563eb;}
  .chips.wrap{flex-wrap:wrap;}
  .fchip{
    font:inherit; font-size:12.5px; font-weight:700; padding:7px 11px; border-radius:10px;
    border:1.5px solid var(--line); background:#f8fafc; color:#475569; cursor:pointer;
  }
  .fchip.on{color:#fff; border-color:transparent;}
  .fchip.on.t-off{background:var(--c-off);} .fchip.on.t-late{background:var(--c-late);}
  .fchip.on.t-seongeun{background:var(--c-seongeun);} .fchip.on.t-jeongmin{background:var(--c-jeongmin);}
  #sfCars .fchip.on,#sfStatus .fchip.on,#pfWho .fchip.on{background:#2563eb;}
  .week .fchip{padding:6px 0; width:34px; text-align:center;}
  .week .fchip.on{background:#2563eb;}
  .conflict{
    margin-top:10px; background:var(--warn-bg); border:1.5px solid #fda4af; color:#9f1239;
    border-radius:11px; padding:8px 10px; font-size:11.5px; font-weight:700; line-height:1.5;
  }
  .hint{margin-top:9px; font-size:11px; color:#64748b; background:#f8fafc; border-radius:9px; padding:8px 9px; line-height:1.5;}
  .hint.err{background:#fff1f2; color:#be123c; font-weight:700;}
  .sheet-actions{display:flex; gap:8px; margin-top:14px;}
  .hidden{display:none !important;}

  .toast{
    position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-12px);
    background:#0f172a; color:#fff; font-size:12.5px; font-weight:700; padding:9px 15px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.2s; z-index:80; max-width:88vw; text-align:center;
    box-shadow:0 8px 20px rgba(15,23,42,.25);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .footer-note{text-align:center; font-size:10px; color:#94a3b8; margin-top:12px;}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-row">
      <h1>🚗 가족 차량·일정</h1>
      <span id="conn" class="conn">연결 중…</span>
    </div>
    <div class="role-row">
      <span class="role-label">내 역할</span>
      <div class="chips" id="roleChips">
        <button class="chip" data-role="성은" type="button">성은</button>
        <button class="chip" data-role="남편" type="button">남편</button>
        <button class="chip" data-role="정민" type="button">정민</button>
      </div>
    </div>
    <div class="legend">
      <span class="lg"><i class="sw off"></i>남편 휴무일</span>
      <span class="lg"><i class="sw late"></i>남편 외박/미귀가</span>
      <span class="lg"><i class="sw seongeun"></i>성은 차량 사용</span>
      <span class="lg"><i class="sw jeongmin"></i>정민 차량 사용</span>
      <span class="lg"><i class="sw pickup"></i>픽업 요청</span>
    </div>
  </header>

  <section class="card cal">
    <div class="cal-head">
      <button class="navbtn" id="prevMonth" type="button" aria-label="이전 달">‹</button>
      <div class="month" id="monthLabel">—</div>
      <button class="navbtn" id="nextMonth" type="button" aria-label="다음 달">›</button>
      <button class="today" id="todayBtn" type="button">오늘</button>
    </div>
    <div class="dows"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card detail">
    <div class="detail-head">
      <div>
        <div class="ddate" id="detailDate">—</div>
        <div class="dsub" id="detailSub"></div>
        <div class="dbadges" id="detailBadges"></div>
      </div>
      <div class="dact">
        <button class="btn primary" id="addScheduleBtn" type="button">+ 일정</button>
        <button class="btn" id="addPickupBtn" type="button">+ 픽업</button>
      </div>
    </div>
    <div id="conflictArea"></div>
    <div class="list" id="scheduleList"></div>
    <div class="subhead">🙋 정민·하선·준서 픽업 요청</div>
    <div class="list" id="pickupList"></div>
  </section>

  <div class="footer-note">가족 5명 · 차 2대(씨라 · 루핀) · 실시간 공유</div>
</div>

<!-- ================= 일정/픽업 입력 시트 ================= -->
<div class="modal hidden" id="modal">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <b id="sheetTitle">일정 추가</b>
      <button class="x" id="sheetClose" type="button" aria-label="닫기">✕</button>
    </div>

    <!-- 일정 폼 -->
    <div id="scheduleForm">
      <label class="flabel">일정 종류</label>
      <div class="chips wrap" id="sfTypes">
        <button class="fchip t-off" data-type="off" type="button">남편 휴무일</button>
        <button class="fchip t-late" data-type="late" type="button">남편 외박/미귀가</button>
        <button class="fchip t-seongeun" data-type="seongeun" type="button">성은 차량 사용</button>
        <button class="fchip t-jeongmin" data-type="jeongmin" type="button">정민 차량 사용</button>
      </div>

      <label class="flabel" for="sfDate">날짜</label>
      <input class="inp" type="date" id="sfDate">

      <div id="sfTimeWrap">
        <label class="flabel">시간대</label>
        <div class="row"><label class="chk"><input type="checkbox" id="sfAllDay"> 종일</label></div>
        <div class="row times" id="sfTimes">
          <input class="inp" type="time" id="sfStart">
          <span>~</span>
          <input class="inp" type="time" id="sfEnd">
        </div>
      </div>

      <div id="sfCarWrap">
        <label class="flabel">차량</label>
        <div class="chips" id="sfCars">
          <button class="fchip" data-car="cira" type="button">🚙 씨라</button>
          <button class="fchip" data-car="lupin" type="button">🚙 루핀</button>
        </div>
      </div>

      <div id="sfStatusWrap">
        <label class="flabel">상태</label>
        <div class="chips" id="sfStatus">
          <button class="fchip" data-status="requested" type="button">요청</button>
          <button class="fchip" data-status="confirmed" type="button">확정</button>
        </div>
      </div>

      <div id="sfRepeatWrap">
        <label class="flabel" for="sfRepeat">반복</label>
        <select class="inp" id="sfRepeat">
          <option value="none">반복 안 함</option>
          <option value="weekly">매주 (요일 선택)</option>
          <option value="biweekly">2주마다 (격주 · 요일 선택)</option>
          <option value="monthly">매월 (해당 일자)</option>
        </select>
        <div id="sfWeekWrap" class="hidden">
          <label class="flabel">반복 요일</label>
          <div class="chips week" id="sfWeekdays">
            <button class="fchip" data-dow="0" type="button">일</button>
            <button class="fchip" data-dow="1" type="button">월</button>
            <button class="fchip" data-dow="2" type="button">화</button>
            <button class="fchip" data-dow="3" type="button">수</button>
            <button class="fchip" data-dow="4" type="button">목</button>
            <button class="fchip" data-dow="5" type="button">금</button>
            <button class="fchip" data-dow="6" type="button">토</button>
          </div>
        </div>

<script>
(function(){
  'use strict';

  /* ================= 상수 ================= */
  var DB = 'https://heung-office-default-rtdb.firebaseio.com/apps/family-car-2026/';
  var DOW = ['일','월','화','수','목','금','토'];
  var ROLES = ['성은','남편','정민'];
  var PICKUP_WHO = ['정민','하선','준서'];
  var WHO_CLASS = { '정민':'jeongmin', '하선':'haseon', '준서':'junseo' };
  function normWho(p){ var r = p && p.requestedBy; return PICKUP_WHO.indexOf(r) >= 0 ? r : '정민'; }
  var CARS = { cira:'씨라', lupin:'루핀' };
  var TYPES = {
    off:      { label:'남편 휴무일',      car:false },
    late:     { label:'남편 외박/미귀가', car:false },
    seongeun: { label:'성은 차량 사용',   car:true  },
    jeongmin: { label:'정민 차량 사용',   car:true  }
  };
  var TYPE_ORDER = ['off','late','seongeun','jeongmin'];

  /* ================= 유틸 ================= */
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseISO(s){ var p = String(s||'').split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
  function addDays(s,n){ var d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
  function dowOf(s){ return parseISO(s).getDay(); }
  function dayDiff(a,b){ return Math.round((parseISO(b).getTime() - parseISO(a).getTime()) / 86400000); }
  /* 시작 주(일요일 시작) 기준 주 번호 — 격주(2주마다) 판정 */
  function weekIndexFromAnchor(anchor, d){
    var diff = dayDiff(anchor, d);
    if(diff < 0) return -1;
    return Math.floor((diff + dowOf(anchor)) / 7);
  }
  function clone(o){ var r = {}; Object.keys(o || {}).forEach(function(k){ r[k] = o[k]; }); return r; }
  function hasKey(o,k){ return !!o && Object.prototype.hasOwnProperty.call(o,k); }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function md(s){ var d = parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }
  function todaySeoul(){
    try{
      return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    }catch(e){ return iso(new Date()); }
  }
  function lsGet(k,d){ try{ var v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var TODAY = todaySeoul();

  /* ================= 상태 ================= */
  var state = {
    schedules: {},
    pickups: {},
    role: ROLES.indexOf(lsGet('fcs.role','성은')) >= 0 ? lsGet('fcs.role','성은') : '성은',
    selected: TODAY,
    viewMonth: (function(){ var d = parseISO(TODAY); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
    insts: {},
    pkInsts: {},
    conn: 'connecting',
    esOpen: 0
  };

  var form = { open:false, kind:null, mode:'new', sid:null, instKey:null, baseDate:null,
               type:'seongeun', date:'', allDay:false, start:'09:00', end:'18:00', car:'cira',
               status:'requested', repeat:{freq:'none', days:[], day:1}, note:'' };

  var pform = { id:null, mode:'new', baseDate:null, date:'', time:'15:30', place:'', note:'',
                requestedBy:null, acceptedBy:null, repeat:{ freq:'none', days:[], day:1 }, daysTouched:false };

  /* ================= 데이터 정규화 ================= */
  function normRepeat(s){
    var r = s && s.repeat;
    if(!r || !r.freq || r.freq === 'none') return null;
    if(r.freq === 'weekly'){
      var days = (r.days && r.days.length) ? r.days.map(Number) : [dowOf(s.date)];
      return { freq:'weekly', days: days };
    }
    if(r.freq === 'biweekly'){
      var bdays = (r.days && r.days.length) ? r.days.map(Number) : [dowOf(s.date)];
      return { freq:'biweekly', days: bdays };
    }
    if(r.freq === 'monthly'){
      return { freq:'monthly', day: Number(r.day || parseISO(s.date).getDate()) };
    }
    return null;
  }
  function repeatText(r){
    if(!r) return '';
    if(r.freq === 'weekly') return '매주 ' + r.days.map(function(d){ return DOW[d]; }).join('·');
    if(r.freq === 'biweekly') return '2주마다 ' + r.days.map(function(d){ return DOW[d]; }).join('·');
    if(r.freq === 'monthly') return '매월 ' + r.day + '일';
    return '';
  }
  function mkInst(s, baseDate, occDate){
    return {
      key: s.id + '|' + baseDate,
      sid: s.id,
      baseDate: baseDate,
      occDate: occDate,
      type: s.type,
      allDay: !!s.allDay,
      start: s.start || '00:00',
      end: s.end || '23:59',
      car: s.car || null,
      status: s.status || 'requested',
      note: s.note || '',
      repeat: normRepeat(s),
      by: s.by || '',
      moved: false,
      overridden: false
    };
  }
  function matchesRepeat(rep, dateStr, baseDate){
    if(!rep) return false;
    var dow = dowOf(dateStr);
    if(rep.freq === 'weekly') return rep.days.indexOf(dow) >= 0;
    if(rep.freq === 'biweekly') return rep.days.indexOf(dow) >= 0 && weekIndexFromAnchor(baseDate, dateStr) % 2 === 0;
    if(rep.freq === 'monthly') return Number(dateStr.slice(8,10)) === Number(rep.day);
    return false;
  }

  /* 반복 인스턴스 전개: [from,to] 안에 표시될 모든 일정 (이동 예외는 ±62일까지 추적) */
  function buildInstances(from, to){
    var res = [];
    Object.keys(state.schedules).forEach(function(sid){
      var s = state.schedules[sid];
      if(!s || !s.date || !TYPES[s.type]) return;
      var rep = normRepeat(s);
      if(!rep){
        if(s.date >= from && s.date <= to) res.push(mkInst(s, s.date, s.date));
        return;
      }
      var d = addDays(from, -62);
      var stop = addDays(to, 62);
      while(d <= stop){
        if(d >= s.date && matchesRepeat(rep, d, s.date)){
          var ex = (s.exceptions && s.exceptions[d]) || null;
          if(!ex || !ex.skip){
            var inst = mkInst(s, d, d);
            if(ex && ex.moveTo){
              inst.occDate = ex.moveTo;
              inst.moved = ex.moveTo !== d;
              inst.overridden = true;
              if(typeof ex.allDay !== 'undefined') inst.allDay = !!ex.allDay;
              if(ex.start) inst.start = ex.start;
              if(ex.end) inst.end = ex.end;
              if('car' in ex && ex.car) inst.car = ex.car;
            }
            if(inst.occDate >= from && inst.occDate <= to) res.push(inst);
          }
        }
        d = addDays(d, 1);
      }
    });
    res.sort(function(a,b){
      if(a.allDay !== b.allDay) return a.allDay ? -1 : 1;
      if(a.start !== b.start) return a.start < b.start ? -1 : 1;
      return TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type);
    });
    return res;
  }

  function indexByDate(list){
    var map = {};
    list.forEach(function(i){ (map[i.occDate] = map[i.occDate] || []).push(i); });
    return map;
  }

  /* ================= 픽업 반복 (전개·인스턴스) ================= */
  function normPickupRepeat(p){
    var r = p && p.repeat;
    if(!r || !r.freq || r.freq === 'none') return null;
    if(r.freq === 'weekly' || r.freq === 'biweekly'){
      var days = (r.days && r.days.length)
        ? r.days.map(Number).filter(function(d){ return d >= 0 && d <= 6; })
        : [];
      if(!days.length) days = [dowOf(p.date)];
      return { freq:r.freq, days: days.sort(function(a,b){ return a-b; }) };
    }
    if(r.freq === 'monthly'){
      return { freq:'monthly', day: Number(r.day || parseISO(p.date).getDate()) };
    }
    return null;
  }
  function pickupRepeatText(r){
    if(!r) return '';
    if(r.freq === 'weekly') return '매주 ' + r.days.map(function(d){ return DOW[d]; }).join('·');
    if(r.freq === 'biweekly') return '2주마다 ' + r.days.map(function(d){ return DOW[d]; }).join('·');
    if(r.freq === 'monthly') return '매월 ' + r.day + '일';
    return '';
  }
  function pkMatches(rep, anchor, d){
    if(rep.freq === 'monthly') return Number(d.slice(8,10)) === Number(rep.day);
    if(rep.days.indexOf(dowOf(d)) < 0) return false;
    if(rep.freq === 'weekly') return true;
    if(rep.freq === 'biweekly') return weekIndexFromAnchor(anchor, d) % 2 === 0;
    return false;
  }
  /* 인스턴스: ex(그 날짜 예외)를 덮어입힌 사본. 반복 픽업의 수락은 회차별 독립 */
  function mkPickupInst(p, baseDate, occDate, ex){
    var rep = normPickupRepeat(p);
    var acc = (ex && hasKey(ex, 'acceptedBy')) ? (ex.acceptedBy || null) : (rep ? null : (p.acceptedBy || null));
    var changed = false;
    if(ex){
      if(ex.moveTo && ex.moveTo !== baseDate) changed = true;
      if(typeof ex.time === 'string' && ex.time !== (p.time || '')) changed = true;
      if(typeof ex.place === 'string' && ex.place !== (p.place || '')) changed = true;
      if(typeof ex.note === 'string' && ex.note !== (p.note || '')) changed = true;
      if(typeof ex.requestedBy === 'string' && ex.requestedBy !== (p.requestedBy || '')) changed = true;
    }
    return {
      key: p.id + '|' + baseDate,
      id: p.id, baseDate: baseDate, date: occDate,
      time: (ex && ex.time) || p.time || '',
      place: (ex && typeof ex.place === 'string') ? ex.place : (p.place || ''),
      note: (ex && typeof ex.note === 'string') ? ex.note : (p.note || ''),
      requestedBy: normWho({ requestedBy: (ex && ex.requestedBy) || p.requestedBy }),
      acceptedBy: acc,
      repeat: rep,
      overridden: changed,
      moved: false
    };
  }
  function buildPickupInstances(from, to){
    var res = [];
    Object.keys(state.pickups).forEach(function(id){
      var p = state.pickups[id];
      if(!p || !p.date) return;
      var rep = normPickupRepeat(p);
      if(!rep){
        if(p.date >= from && p.date <= to) res.push(mkPickupInst(p, p.date, p.date, null));
        return;
      }
      var d = addDays(from, -62), stop = addDays(to, 62);
      while(d <= stop){
        if(d >= p.date && pkMatches(rep, p.date, d)){
          var ex = (p.exceptions && p.exceptions[d]) || null;
          if(!ex || !ex.skip){
            var inst = mkPickupInst(p, d, d, ex);
            if(ex && ex.moveTo){ inst.date = ex.moveTo; inst.moved = ex.moveTo !== d; }
            if(inst.date >= from && inst.date <= to) res.push(inst);
          }
        }
        d = addDays(d, 1);
      }
    });
    res.sort(function(a,b){
      var t = String(a.time || '').localeCompare(String(b.time || ''));
      if(t) return t;
      if(a.id !== b.id) return a.id < b.id ? -1 : 1;
      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    });
    return res;
  }

  function overlap(a,b){
    if(!a.car || !b.car || a.car !== b.car) return false;
    if(a.occDate && b.occDate && a.occDate !== b.occDate) return false;
    if(a.allDay || b.allDay) return true;
    return (a.start < b.end) && (b.start < a.end);
  }
  function conflictMap(list){
    var hit = {};
    for(var i=0;i<list.length;i++){
      for(var j=i+1;j<list.length;j++){
        if(overlap(list[i], list[j])){ hit[list[i].key] = true; hit[list[j].key] = true; }
      }
    }
    return hit;
  }
  function conflictPairs(list){
    var out = [];
    for(var i=0;i<list.length;i++){
      for(var j=i+1;j<list.length;j++){
        if(overlap(list[i], list[j])) out.push([list[i], list[j]]);
      }
    }
    return out;
  }

  /* ================= Firebase REST + SSE ================= */
  var streams = [];
  var pollTimer = null;
  function setConn(kind){
    state.conn = kind;
    var el = $('#conn');
    if(!el) return;
    if(kind === 'live'){ el.textContent = '● 실시간'; el.className = 'conn live'; }
    else if(kind === 'poll'){ el.textContent = '◐ 폴링 동기화'; el.className = 'conn poll'; }
    else if(kind === 'off'){ el.textContent = '○ 오프라인'; el.className = 'conn off'; }
    else { el.textContent = '연결 중…'; el.className = 'conn'; }
  }

  function url(path){ return DB + path + '.json'; }

  function fetchJSON(path){
    return fetch(url(path), { cache:'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function fetchAll(){
    return Promise.all([fetchJSON('schedules'), fetchJSON('pickups')]).then(function(res){
      state.schedules = res[0] || {};
      state.pickups = res[1] || {};
      renderAll();
      if(state.esOpen === 0 && !pollTimer) setConn('poll');
    }).catch(function(){
      if(state.esOpen === 0) setConn('off');
    });
  }

  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  function startPolling(){
    if(pollTimer) return;
    pollTimer = setInterval(fetchAll, 15000);
    setConn('poll');
  }

  function applySchedules(path, data){
    if(!path || path === '/'){
      state.schedules = data || {};
    }else{
      var id = path.replace(/^\//,'');
      if(data === null || typeof data === 'undefined') delete state.schedules[id];
      else state.schedules[id] = data;
    }
    renderAll();
    refreshFormConflict();
  }
  function applyPickups(path, data){
    if(!path || path === '/'){
      state.pickups = data || {};
    }else{
      var id = path.replace(/^\//,'');
      if(data === null || typeof data === 'undefined') delete state.pickups[id];
      else state.pickups[id] = data;
    }
    renderAll();
  }

  function openStream(path, apply){
    if(typeof EventSource === 'undefined') return false;
    try{
      var es = new EventSource(url(path));
      es.addEventListener('put', function(e){
        try{ var m = JSON.parse(e.data); apply(m.path, m.data); }catch(err){}
      });
      es.addEventListener('patch', function(e){
        try{ var m = JSON.parse(e.data); apply(m.path, m.data); }catch(err){}
      });
      es.onopen = function(){ if(!es._open){ es._open = true; state.esOpen++; } setConn('live'); stopPolling(); };
      es.onerror = function(){ if(es._open){ es._open = false; state.esOpen = Math.max(0, state.esOpen - 1); } startPolling(); };
      streams.push(es);
      return true;
    }catch(err){ return false; }
  }

  function startSync(){
    fetchAll().then(function(){
      var a = openStream('schedules', applySchedules);
      var b = openStream('pickups', applyPickups);
      if(!a || !b){ startPolling(); return; }
      setTimeout(function(){ if(state.esOpen === 0) startPolling(); }, 5000);
    });
  }

  function putSchedule(s){
    state.schedules[s.id] = s;
    renderAll();
    refreshFormConflict();
    return fetch(url('schedules/' + s.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(s) })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return true; })
      .catch(function(e){ toast('저장 실패: ' + e.message); fetchAll(); return false; });
  }
  function delSchedule(id){
    delete state.schedules[id];
    renderAll();
    return fetch(url('schedules/' + id), { method:'DELETE' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return true; })
      .catch(function(e){ toast('삭제 실패: ' + e.message); fetchAll(); return false; });
  }
  function putPickup(p){
    state.pickups[p.id] = p;
    renderAll();
    return fetch(url('pickups/' + p.id), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return true; })
      .catch(function(e){ toast('저장 실패: ' + e.message); fetchAll(); return false; });
  }
  function delPickup(id){
    delete state.pickups[id];
    renderAll();
    return fetch(url('pickups/' + id), { method:'DELETE' })
      .then(function(r){ return true; })
      .catch(function(e){ toast('삭제 실패: ' + e.message); return false; });
  }

  /* ================= 렌더: 상단 역할 ================= */
  function renderRole(){
    $$('#roleChips .chip').forEach(function(b){
      b.classList.toggle('on', b.dataset.role === state.role);
    });
  }

  /* ================= 렌더: 달력 ================= */
  function monthRange(){
    var y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
    var first = new Date(y, m, 1), last = new Date(y, m+1, 0);
    return { start: addDays(iso(first), -first.getDay()), end: addDays(iso(last), 6 - last.getDay()) };
  }

  function renderCalendar(){
    var y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
    $('#monthLabel').textContent = y + '년 ' + (m+1) + '월';

    var range = monthRange();
    var list = buildInstances(range.start, range.end);
    var idx = indexByDate(list);
    var hit = conflictMap(list);
    var pkDay = {};
    buildPickupInstances(range.start, range.end).forEach(function(i){
      pkDay[i.date] = (pkDay[i.date] || 0) + 1;
    });

    var html = '';
    for(var d = range.start; d <= range.end; d = addDays(d,1)){
      var dt = parseISO(d);
      var items = idx[d] || [];
      var types = [];
      items.forEach(function(i){ if(types.indexOf(i.type) < 0) types.push(i.type); });
      var isOff = items.some(function(i){ return i.type === 'off'; });
      var hasConf = items.some(function(i){ return hit[i.key]; });

      var cls = 'cell';
      if(dt.getMonth() !== m) cls += ' other';
      if(d === TODAY) cls += ' today';
      if(d === state.selected) cls += ' sel';

      var dots = types.map(function(t){ return '<i class="dot ' + t + '"></i>'; }).join('')
               + (pkDay[d] ? '<i class="dot pickup"></i>' : '');
      var flags = (isOff ? '<span class="avail">정민🚗가능</span>' : '') + (hasConf ? '<span class="cwarn">⚠</span>' : '');

      html += '<button type="button" class="' + cls + '" data-date="' + d + '" aria-label="' + d + '">'
            +   '<span class="dnum">' + dt.getDate() + '</span>'
            +   '<span class="dots">' + dots + '</span>'
            +   '<span class="cellflags">' + flags + '</span>'
            + '</button>';
    }
    $('#grid').innerHTML = html;
  }

  /* ================= 렌더: 상세 ================= */
  function timeText(i){
    if(!TYPES[i.type].car) return i.allDay ? '종일' : '';
    return i.allDay ? '종일' : (i.start + '~' + i.end);
  }

  function scheduleCardHTML(i, hit){
    var t = TYPES[i.type];
    var isCar = t.car;
    var cls = 'scard t-' + i.type;
    if(isCar && i.status !== 'confirmed') cls += ' requested';
    if(hit[i.key]) cls += ' conflict';

    var tags = '';
    if(isCar) tags += '<span class="tag car">🚙 ' + CARS[i.car || 'cira'] + '</span>';
    if(isCar) tags += (i.status === 'confirmed' ? '<span class="tag ok">확정</span>' : '<span class="tag req">요청</span>');
    if(hit[i.key]) tags += '<span class="tag bad">⚠ 중복</span>';
    if(i.moved) tags += '<span class="tag moved">↔ ' + md(i.baseDate) + '에서 이동</span>';
    else if(i.overridden) tags += '<span class="tag moved">이 날짜만 변경</span>';

    var meta = [];
    if(isCar) meta.push('🕘 ' + timeText(i));
    else meta.push('종일');
    if(i.repeat) meta.push('🔁 ' + repeatText(i.repeat));

    var acts = '';
    if(isCar){
      acts += '<button type="button" class="mini go" data-act="status" data-key="' + esc(i.key) + '">'
            + (i.status === 'confirmed' ? '요청으로 되돌리기' : '확정하기') + '</button>';
    }
    if(i.repeat){
      acts += '<button type="button" class="mini" data-act="inst-edit" data-key="' + esc(i.key) + '">이 날짜만 이동</button>';
      acts += '<button type="button" class="mini danger" data-act="inst-skip" data-key="' + esc(i.key) + '">이 날짜만 삭제</button>';
      acts += '<button type="button" class="mini" data-act="base-edit" data-sid="' + esc(i.sid) + '">전체 수정</button>';
      acts += '<button type="button" class="mini danger" data-act="base-del" data-sid="' + esc(i.sid) + '">전체 삭제</button>';
    }else{
      acts += '<button type="button" class="mini" data-act="base-edit" data-sid="' + esc(i.sid) + '">수정</button>';
      acts += '<button type="button" class="mini danger" data-act="base-del" data-sid="' + esc(i.sid) + '">삭제</button>';
    }

    return '<div class="' + cls + '" data-key="' + esc(i.key) + '">'
         +   '<div class="sc-row1"><span class="sc-title">' + esc(t.label) + '</span><span class="tags">' + tags + '</span></div>'
         +   '<div class="sc-meta">' + esc(meta.join(' · ')) + '</div>'
         +   (i.note ? '<div class="sc-note">' + esc(i.note) + '</div>' : '')
         +   '<div class="sc-act">' + acts + '</div>'
         + '</div>';

  function renderDetail(){
    var sel = state.selected;
    var dt = parseISO(sel);
    var list = buildInstances(sel, sel).filter(function(i){ return i.occDate === sel; });
    var hit = conflictMap(list);
    var pairs = conflictPairs(list);

    state.insts = {};
    list.forEach(function(i){ state.insts[i.key] = i; });

    $('#detailDate').textContent = (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 (' + DOW[dt.getDay()] + ')';
    $('#detailSub').textContent = sel + (sel === TODAY ? ' · 오늘' : '');

    var isOff = list.some(function(i){ return i.type === 'off'; });
    var badges = '';
    if(isOff) badges += '<span class="badge avail">🟢 정민 차량 사용 가능</span>';
    if(pairs.length) badges += '<span class="badge conf">⚠ 차량 중복 ' + pairs.length + '건</span>';
    $('#detailBadges').innerHTML = badges;

    var area = '';
    if(pairs.length){
      var involvedCars = [];
      var perCar = {};
      list.forEach(function(i){
        if(!hit[i.key]) return;
        if(!perCar[i.car]){ perCar[i.car] = []; involvedCars.push(i.car); }
        perCar[i.car].push(i);
      });
      area = '<div class="alert"><div><span class="atitle">⚠️ 같은 차량이 겹칩니다</span>'
           + involvedCars.map(function(car){
               return '<span class="aline">🚙 ' + CARS[car] + '</span>'
                 + perCar[car].map(function(i){
                     return '<span class="aline sub">· ' + timeText(i) + ' ' + TYPES[i.type].label
                          + (i.status === 'confirmed' ? ' <b>(확정)</b>' : ' (요청)') + '</span>';
                   }).join('');
             }).join('')
           + '</div></div>';
    }
    $('#conflictArea').innerHTML = area;

    var pickups = buildPickupInstances(sel, sel).filter(function(i){ return i.date === sel; });
    state.pkInsts = {};
    pickups.forEach(function(i){ state.pkInsts[i.key] = i; });

    $('#scheduleList').innerHTML = list.length
      ? list.map(function(i){ return scheduleCardHTML(i, hit); }).join('')
      : (pickups.length ? '' : '<div class="empty">이 날짜에 등록된 일정이 없습니다.<br>오른쪽 위 <b>+ 일정</b>으로 추가하세요.</div>');

    $('#pickupList').innerHTML = pickups.length
      ? pickups.map(pickupCardHTML).join('')
      : '<div class="empty">픽업 요청이 없습니다.</div>';
  }

  /* ================= 범위 선택 시트 (이 날짜만 / 전체 반복) ================= */
  var scopeResolve = null;
  function askScope(title, msg, opts){
    return new Promise(function(resolve){
      scopeResolve = resolve;
      $('#scopeTitle').textContent = title;
      var m = $('#scopeMsg');
      if(msg){ m.style.display = ''; m.textContent = msg; } else { m.style.display = 'none'; }
      $('#scopeActions').innerHTML = opts.map(function(o){
        return '<button type="button" class="' + o.cls + '" data-val="' + o.val + '">' + o.label + '</button>';
      }).join('') + '<button type="button" class="btn wide" data-val="cancel">취소</button>';
      $('#scopeModal').classList.remove('hidden');
      document.body.classList.add('lock');
    });
  }
  function closeScope(v){
    $('#scopeModal').classList.add('hidden');
    if(!form.open) document.body.classList.remove('lock');
    var r = scopeResolve;
    scopeResolve = null;
    if(r) r(v || null);

    var instMode = form.mode === 'instance';

    $$('#sfTypes .fchip').forEach(function(b){
      b.classList.toggle('on', b.dataset.type === form.type);
      b.disabled = instMode && b.dataset.type !== form.type;
      b.style.opacity = (instMode && b.dataset.type !== form.type) ? '.45' : '';
    });

    $('#sfAllDay').checked = !!form.allDay;
    $('#sfStart').value = form.start || '09:00';
    $('#sfEnd').value = form.end || '18:00';
    $('#sfTimes').classList.toggle('hidden', !!form.allDay);
    $('#sfTimeWrap').classList.toggle('hidden', !isCar && !instMode);
    if(!isCar && !instMode) $('#sfTimeWrap').classList.add('hidden');

    $('#sfCarWrap').classList.toggle('hidden', !isCar);
    $$('#sfCars .fchip').forEach(function(b){ b.classList.toggle('on', b.dataset.car === form.car); });

    $('#sfStatusWrap').classList.toggle('hidden', !isCar || instMode);

    $('#sfRepeatWrap').classList.toggle('hidden', instMode);

    $('#sfMonthWrap').classList.toggle('hidden', form.repeat.freq !== 'monthly');

      b.classList.toggle('on', form.repeat.days.indexOf(Number(b.dataset.dow)) >= 0);
    });
    $('#sfMonthDay').value = form.repeat.day || 1;
    $('#sfNote').value = form.note || '';

    // 안내문

    if(instMode){
      var s = state.schedules[form.sid];
      hintEl.classList.remove('hidden');
      hintEl.classList.remove('err');
      hintEl.innerHTML = '반복 일정(' + esc(repeatText(normRepeat(s))) + ')의 <b>' + esc(md(form.baseDate)) + '</b> 회차만 수정합니다. 날짜·시간·차량을 바꾸면 그 날짜만 옮겨집니다.';
    }else{
      hintEl.classList.add('hidden');

    // 하단 버튼

      save.textContent = '수정 저장';

    }else{
      save.textContent = '이 날짜만 저장';
      extra.innerHTML =
        '<button class="btn wide" id="siSkip" type="button">이 날짜만 삭제</button>' +
        '<button class="btn wide" id="siBase" type="button">전체 수정</button>';
    }
    refreshFormConflict();

  /* 폼 안 실시간 중복 경고 */
  function refreshFormConflict(){
    if(!form.open || form.kind !== 'schedule') return;
    var box = $('#sfConflict');
    var isCar = TYPES[form.type].car;
    var hint = $('#sfHint');
    if(!form.date){ box.classList.add('hidden'); return; }

    var problems = [];
    if(!isCar){
      box.classList.add('hidden');
      return;
    }
    if(!form.allDay && (!form.start || !form.end || form.start >= form.end)){
      box.classList.remove('hidden');
      box.innerHTML = '⚠️ 종료 시간이 시작 시간보다 빠릅니다.';
      return;
    }

    var cand = {
      key: '__form__', sid: form.sid || null, type: form.type, allDay: !!form.allDay,
      start: form.start, end: form.end, car: form.car, occDate: form.date
    };
    var others = buildInstances(form.date, form.date).filter(function(i){
      return i.occDate === form.date && i.car && i.sid !== form.sid;
    });
    others.forEach(function(o){
      if(overlap(cand, o)){
        problems.push('· ' + CARS[o.car] + ' ' + timeText(o) + ' — ' + TYPES[o.type].label + (o.note ? ' (' + o.note + ')' : ''));
      }
    });

    if(problems.length){
      box.classList.remove('hidden');
      box.innerHTML = '⚠️ 차량 중복! 이 시간에 <b>' + CARS[form.car] + '</b>가 이미 배정돼 있습니다.<br>' + esc(problems.join('\n')).replace(/\n/g,'<br>');
    }else{
      box.classList.add('hidden');
      box.innerHTML = '';
    }
  }

  function openScheduleForm(mode, data){

    form.mode = mode;
    form.kind = 'schedule';
    form.instKey = null;
    form.baseDate = null;

    if(mode === 'new'){
      form.sid = null;
      form.type = 'seongeun';
      form.date = state.selected;
      form.allDay = false;
      form.start = '09:00';
      form.end = '18:00';
      form.car = 'cira';
      form.status = 'requested';

    }else if(mode === 'edit'){
      var s = data;
      form.sid = s.id;
      form.type = s.type;
      form.date = s.date;
      form.allDay = !!s.allDay;
      form.start = s.start || '09:00';
      form.end = s.end || '18:00';
      form.car = s.car || 'cira';
      form.status = s.status || 'requested';
      form.note = s.note || '';

      form.repeat = { freq: rep.freq || 'none', days: rep.days || [dowOf(s.date)], day: rep.day || parseISO(s.date).getDate() };

  function readScheduleForm(){
    form.date = $('#sfDate').value || form.date;
    form.allDay = $('#sfAllDay').checked;
    form.start = $('#sfStart').value || form.start;
    form.end = $('#sfEnd').value || form.end;
    form.note = $('#sfNote').value;
    form.repeat.freq = $('#sfRepeat').value;
    form.repeat.day = Number($('#sfMonthDay').value) || parseISO(form.date).getDate();
  }

  function saveSchedule(){
    readScheduleForm();
    var isCar = TYPES[form.type].car;

    if(!form.date){ toast('날짜를 선택하세요'); return; }
    if(isCar && !form.allDay && (!form.start || !form.end || form.start >= form.end)){
      toast('시간 범위를 확인하세요'); return;
    }
    if(form.mode === 'instance'){ saveInstance(); return; }

    var id = form.sid || ('s' + Date.now().toString(36) + Math.random().toString(36).slice(2,5));
    var prev = state.schedules[id] || {};
    var s = {
      id: id,
      type: form.type,
      date: form.date,
      allDay: isCar ? !!form.allDay : true,
      start: (isCar && !form.allDay) ? form.start : '',
      end: (isCar && !form.allDay) ? form.end : '',
      car: isCar ? form.car : null,
      status: isCar ? form.status : 'confirmed',
      note: form.note || '',
      repeat: form.repeat.freq === 'none' ? { freq:'none' }
            : (form.repeat.freq === 'monthly'
                ? { freq:'monthly', day: form.repeat.day }
                : { freq: form.repeat.freq, days: (form.repeat.days.length ? form.repeat.days.slice().sort() : [dowOf(form.date)]) }),
      exceptions: prev.exceptions || null,
      by: state.role,
      createdAt: prev.createdAt || Date.now(),
      updatedAt: Date.now(),
      updatedBy: state.role
    };
    putSchedule(s).then(function(ok){
      if(ok){
        form.sid = s.id;
        toast(form.mode === 'edit' ? '수정했습니다' : '일정을 등록했습니다');
        jumpTo(s.date);
        closeModal();
      }
    });
  }

  function saveInstance(){
    var s = state.schedules[form.sid];
    if(!s){ toast('원본 반복 일정을 찾을 수 없습니다'); return; }
    var ex = {};
    Object.keys(s.exceptions || {}).forEach(function(k){ ex[k] = s.exceptions[k]; });
    var target = {};
    Object.keys(ex[form.baseDate] || {}).forEach(function(k){ target[k] = ex[form.baseDate][k]; });

    target.skip = false;
    target.moveTo = form.date;
    target.allDay = !!form.allDay;
    target.start = form.start;
    target.end = form.end;
    if(TYPES[s.type].car) target.car = form.car;

    ex[form.baseDate] = target;
    var next = {};
    Object.keys(s).forEach(function(k){ next[k] = s[k]; });
    next.exceptions = ex;
    next.updatedAt = Date.now();
    next.updatedBy = state.role;

    putSchedule(next).then(function(ok){
      if(ok){
        toast('이 날짜만 수정했습니다');
        jumpTo(form.date);
        closeModal();
      }
    });
  }

    }else{
      var p = data;
      var rep = normPickupRepeat(p);
      pform.id = p.id;
      pform.date = p.date;
      pform.time = p.time || '15:30';
      pform.place = p.place || '';
      pform.note = p.note || '';
      pform.requestedBy = normWho(p);
      pform.repeat = rep
        ? { freq: rep.freq, days: (rep.days ? rep.days.slice() : [dowOf(p.date)]), day: rep.day || parseISO(p.date).getDate() }
        : { freq:'none', days:[dowOf(p.date)], day: parseISO(p.date).getDate() };
      pform.acceptedBy = p.acceptedBy || null;
    }
    syncPickupWho();
    $('#pfDate').value = pform.date;
    $('#pfTime').value = pform.time;
    $('#pfPlace').value = pform.place;
    $('#pfNote').value = pform.note;
    syncPickupForm();
    showModal('pickup');
  }

  /* 반복 UI·버튼만 갱신 (입력값은 건드리지 않음) */
  function syncPickupForm(){
    var instMode = pform.mode === 'instance';
    $('#pfRepeatWrap').classList.toggle('hidden', instMode);
    $('#pfRepeat').value = pform.repeat.freq;
    var showWeek = !instMode && (pform.repeat.freq === 'weekly' || pform.repeat.freq === 'biweekly');
    $('#pfWeekWrap').classList.toggle('hidden', !showWeek);
    $$('#pfWeekdays .fchip').forEach(function(b){
      b.classList.toggle('on', pform.repeat.days.indexOf(Number(b.dataset.dow)) >= 0);
    });
    $('#pfSave').textContent = instMode ? '이 날짜만 저장' : (pform.id ? '수정 저장' : '픽업 요청 등록');
    var h = $('#pfRepeatHint');
    if(instMode){
      h.classList.remove('hidden');
      h.innerHTML = '🔁 반복 픽업의 <b>' + esc(md(pform.baseDate)) + '</b> 회차만 저장합니다. 날짜를 바꾸면 그 날짜만 옮겨집니다.';
    }else if(pform.repeat.freq !== 'none'){
      h.classList.remove('hidden');
      h.innerHTML = (pform.repeat.freq === 'monthly'
          ? '🔁 매월 ' + esc(pform.repeat.day) + '일 반복'
          : '🔁 ' + esc(pickupRepeatText({ freq:pform.repeat.freq, days: pform.repeat.days.slice().sort(function(a,b){ return a-b; }) })))
        + ' 반복 · 날짜마다 따로 수락·수정할 수 있습니다.';
    }else{
      h.classList.add('hidden');
      h.innerHTML = '';
    }
    if(instMode){
      $('#pfExtra').innerHTML = '<button class="btn wide" id="pfInstDelete" type="button">이 날짜만 삭제</button>';
    }else if(pform.id){
      $('#pfExtra').innerHTML = '<button class="btn danger wide" id="pfDelete" type="button">'
        + (pform.repeat.freq === 'none' ? '요청 삭제' : '반복 전체 삭제') + '</button>';
    }else{
      $('#pfExtra').innerHTML = '';
    }
  }

  function savePickup(){
    pform.date = $('#pfDate').value || pform.date;
    pform.time = $('#pfTime').value || pform.time;
    pform.place = $('#pfPlace').value.trim();
    pform.note = $('#pfNote').value.trim();
    if(!pform.date){ toast('날짜를 선택하세요'); return; }
    if(!pform.place){ toast('장소를 입력하세요'); return; }
    if(pform.mode === 'instance'){ savePickupInstance(); return; }

    /* 반복 설정 읽기 */
    pform.repeat.freq = $('#pfRepeat').value;
    if(pform.repeat.freq === 'monthly'){
      pform.repeat.day = Number(pform.repeat.day) || parseISO(pform.date).getDate();
    }

    var id = pform.id || ('p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5));
    var prev = state.pickups[id] || {};
    var repeat = null;
    if(pform.repeat.freq === 'monthly'){
      repeat = { freq:'monthly', day: pform.repeat.day };
    }else if(pform.repeat.freq === 'weekly' || pform.repeat.freq === 'biweekly'){
      var days = pform.repeat.days.slice().sort(function(a,b){ return a-b; });
      if(!days.length) days = [dowOf(pform.date)];
      repeat = { freq: pform.repeat.freq, days: days };
    }

    var p = {
      id: id,
      date: pform.date,
      time: pform.time,
      place: pform.place,
      note: pform.note,
      requestedBy: PICKUP_WHO.indexOf(pform.requestedBy) >= 0 ? pform.requestedBy : '정민',
      acceptedBy: prev.acceptedBy || null,
      acceptedAt: prev.acceptedAt || null,
      repeat: repeat,
      exceptions: repeat ? (prev.exceptions || null) : null,
      createdBy: prev.createdBy || state.role,
      createdAt: prev.createdAt || Date.now(),
      updatedAt: Date.now(),
      updatedBy: state.role
    };
    putPickup(p).then(function(ok){
      if(ok){
        toast(pform.mode === 'edit'
          ? '수정했습니다'
          : (repeat ? pickupRepeatText(normPickupRepeat(p)) + ' 반복 픽업을 등록했습니다' : '픽업 요청을 등록했습니다'));
        jumpTo(p.date);
        closeModal();
      }
    });
  }

  /* 반복 픽업의 회차 하나만 수정 (그 날짜 예외로 저장) */
  function savePickupInstance(){
    var p = state.pickups[pform.id];
    if(!p || !pform.baseDate){ toast('원본 반복 픽업을 찾을 수 없습니다'); return; }
    var ex = clone(p.exceptions || {});
    var t = clone(ex[pform.baseDate] || {});
    t.skip = false;
    t.moveTo = pform.date;
    t.time = pform.time;
    t.place = pform.place;
    t.note = pform.note;
    t.requestedBy = pform.requestedBy;
    ex[pform.baseDate] = t;
    var nx = clone(p);
    nx.exceptions = ex;
    nx.updatedAt = Date.now();
    nx.updatedBy = state.role;
    putPickup(nx).then(function(ok){
      if(ok){ toast('이 날짜만 수정했습니다'); jumpTo(pform.date); closeModal(); }
    });
  }

  /* ================= 이벤트 ================= */
  $('#roleChips').addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if(!b) return;
    state.role = b.dataset.role;
    lsSet('fcs.role', state.role);
    renderRole();
    toast('내 역할: ' + state.role);
  });

  $('#prevMonth').addEventListener('click', function(){
    state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth()-1, 1);
    renderCalendar();
  });
  $('#nextMonth').addEventListener('click', function(){
    state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth()+1, 1);
    renderCalendar();
  });
  $('#todayBtn').addEventListener('click', function(){
    var d = parseISO(TODAY);
    state.viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    state.selected = TODAY;
    renderAll();
  });

  $('#grid').addEventListener('click', function(e){
    var c = e.target.closest('.cell');
    if(!c) return;
    state.selected = c.dataset.date;
    var d = parseISO(state.selected);
    if(d.getMonth() !== state.viewMonth.getMonth() || d.getFullYear() !== state.viewMonth.getFullYear()){
      state.viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    }
    renderAll();
  });

  $('#addScheduleBtn').addEventListener('click', function(){ openScheduleForm('new'); });
  $('#addPickupBtn').addEventListener('click', function(){ openPickupForm('new', null); });

  /* 일정 카드 액션 */
  $('#scheduleList').addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]');
    if(!b) return;
    var act = b.dataset.act;
    var key = b.dataset.key;
    var sid = b.dataset.sid;
    var inst = key ? state.insts[key] : null;

    if(act === 'status'){
      var s = state.schedules[inst.sid];
      if(!s) return;
      var next = {};
      Object.keys(s).forEach(function(k){ next[k] = s[k]; });
      next.status = (s.status === 'confirmed') ? 'requested' : 'confirmed';
      next.updatedAt = Date.now();
      next.updatedBy = state.role;
      putSchedule(next).then(function(ok){
        if(ok) toast(next.status === 'confirmed' ? state.role + ' 확정했습니다' : '요청 상태로 되돌렸습니다');
      });
    }else if(act === 'inst-edit'){
      if(inst) openScheduleForm('instance', inst);
    }else if(act === 'inst-skip'){
      if(!inst) return;
      if(!confirm(md(inst.occDate) + ' 회차만 반복 일정에서 제외할까요?')) return;
      var base = state.schedules[inst.sid];
      if(!base) return;
      var ex = {};
      Object.keys(base.exceptions || {}).forEach(function(k){ ex[k] = base.exceptions[k]; });
      ex[inst.baseDate] = { skip:true };
      var nx = {};
      Object.keys(base).forEach(function(k){ nx[k] = base[k]; });
      nx.exceptions = ex;
      nx.updatedAt = Date.now();
      putSchedule(nx).then(function(ok){ if(ok) toast('이 날짜만 삭제했습니다'); });
    }else if(act === 'base-edit'){
      var sc = state.schedules[sid];
      if(sc) openScheduleForm('edit', sc);
    }else if(act === 'base-del'){
      var sc2 = state.schedules[sid];
      if(!sc2) return;
      var label = TYPES[sc2.type].label + (normRepeat(sc2) ? ' (반복 전체)' : '');
      if(!confirm('"' + label + '" 일정을 삭제할까요?')) return;
      delSchedule(sid).then(function(ok){ if(ok) toast('삭제했습니다'); });
    }
  });

  /* 픽업 카드 액션 */
  function setPickupAcceptance(inst, who){
    var p = state.pickups[inst.id];
    if(!p) return;
    var nextAccepted = (inst.acceptedBy === who) ? null : who;
    if(!inst.repeat){
      var next = clone(p);
      next.acceptedBy = nextAccepted;
      next.acceptedAt = nextAccepted ? Date.now() : null;
      next.updatedAt = Date.now();
      next.updatedBy = state.role;
      putPickup(next).then(function(ok){
        if(ok) toast(nextAccepted ? nextAccepted + ' 수락했습니다' : '수락을 취소했습니다');
      });
      return;
    }
    /* 반복 픽업: 그 날짜 회차만 수락/해제 (다른 날짜는 그대로) */
    var ex = clone(p.exceptions || {});
    var t = clone(ex[inst.baseDate] || {});
    t.acceptedBy = nextAccepted || '';   /* '' = 이 회차는 수락 안 함 */
    t.acceptedAt = nextAccepted ? Date.now() : '';
    ex[inst.baseDate] = t;
    var nx = clone(p);
    nx.exceptions = ex;
    nx.updatedAt = Date.now();
    nx.updatedBy = state.role;
    putPickup(nx).then(function(ok){
      if(ok) toast(nextAccepted
        ? md(inst.date) + ' · ' + nextAccepted + ' 수락했습니다'
        : md(inst.date) + ' 수락을 취소했습니다');
    });
  }
  function skipPickupInstance(inst){
    var p = state.pickups[inst.id];
    if(!p) return;
    var ex = clone(p.exceptions || {});
    ex[inst.baseDate] = { skip:true };
    var nx = clone(p);
    nx.exceptions = ex;
    nx.updatedAt = Date.now();
    nx.updatedBy = state.role;
    putPickup(nx).then(function(ok){ if(ok) toast(md(inst.date) + ' 회차만 삭제했습니다'); });
  }

  $('#pickupList').addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]');
    if(!b) return;
    var act = b.dataset.act;
    var inst = state.pkInsts[b.dataset.key];
    if(!inst) return;
    var p = state.pickups[inst.id];
    if(!p) return;

    if(act === 'accept'){
      setPickupAcceptance(inst, b.dataset.who);
    }else if(act === 'pedit'){
      if(!inst.repeat){ openPickupForm('edit', p); return; }
      askScope('반복 픽업 수정', md(inst.date) + ' 회차만 고칠지, 반복 전체를 고칠지 선택하세요.', [
        { val:'inst', label:'이 날짜만 수정', cls:'btn primary wide' },
        { val:'base', label:'전체 반복 수정', cls:'btn wide' }
      ]).then(function(v){
        if(v === 'inst') openPickupForm('instance', inst);
        else if(v === 'base') openPickupForm('edit', p);
      });
    }else if(act === 'pdel'){
      if(!inst.repeat){
        if(!confirm('픽업 요청을 삭제할까요?')) return;
        delPickup(inst.id).then(function(ok){ if(ok) toast('삭제했습니다'); });
        return;
      }
      askScope('반복 픽업 삭제', md(inst.date) + ' 회차만 지울지, 반복 전체를 지울지 선택하세요.', [
        { val:'inst', label:'이 날짜만 삭제', cls:'btn danger wide' },
        { val:'base', label:'반복 전체 삭제', cls:'btn danger wide' }
      ]).then(function(v){
        if(v === 'inst') skipPickupInstance(inst);
        else if(v === 'base'){
          if(confirm('반복 픽업 전체를 삭제할까요? (다른 날짜 회차도 모두 사라집니다)')){
            delPickup(inst.id).then(function(ok){ if(ok) toast('반복 전체를 삭제했습니다'); });
          }
        }
      });
    }
  });

  /* 폼: 일정 종류 */
  $('#sfTypes').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b || b.disabled) return;
    form.type = b.dataset.type;
    syncFormUI();
  });
  $('#sfCars').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b) return;
    form.car = b.dataset.car;
    syncFormUI();
  });
  $('#sfStatus').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b) return;
    form.status = b.dataset.status;
    syncFormUI();
  });
  $('#sfWeekdays').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b) return;
    var d = Number(b.dataset.dow);
    var i = form.repeat.days.indexOf(d);
    if(i >= 0) form.repeat.days.splice(i,1); else form.repeat.days.push(d);
    syncFormUI();
  });
  $('#sfRepeat').addEventListener('change', function(){
    form.repeat.freq = this.value;
    if(form.repeat.freq === 'weekly' || form.repeat.freq === 'biweekly'){
      if(!form.repeat.days.length) form.repeat.days = [dowOf(form.date)];
    }
    if(form.repeat.freq === 'monthly') form.repeat.day = parseISO(form.date).getDate();
    syncFormUI();
  });
  $('#sfMonthDay').addEventListener('change', function(){
    form.repeat.day = Math.min(31, Math.max(1, Number(this.value) || 1));
    this.value = form.repeat.day;
    refreshFormConflict();
  });
  $('#sfDate').addEventListener('change', function(){
    form.date = this.value;
    refreshFormConflict();
  });
  $('#sfAllDay').addEventListener('change', function(){
    form.allDay = this.checked;
    $('#sfTimes').classList.toggle('hidden', !!form.allDay);
    refreshFormConflict();
  });
  $('#sfStart').addEventListener('change', function(){ form.start = this.value; refreshFormConflict(); });
  $('#sfEnd').addEventListener('change', function(){ form.end = this.value; refreshFormConflict(); });
  $('#sfNote').addEventListener('input', function(){ form.note = this.value; });

  $('#sfSave').addEventListener('click', saveSchedule);
  $('#sfCancel').addEventListener('click', closeModal);
  $('#sfExtra').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.id === 'sfDelete'){
      var s = state.schedules[form.sid];
      if(!s) return;
      if(!confirm('이 일정을 삭제할까요?')) return;
      delSchedule(s.id).then(function(ok){ if(ok){ toast('삭제했습니다'); closeModal(); } });
    }else if(b.id === 'siSkip'){
      var inst = state.insts[form.instKey];
      var base = state.schedules[form.sid];
      if(!base || !form.baseDate) return;
      if(!confirm(md(form.baseDate) + ' 회차만 반복 일정에서 제외할까요?')) return;
      var ex = {};
      Object.keys(base.exceptions || {}).forEach(function(k){ ex[k] = base.exceptions[k]; });
      ex[form.baseDate] = { skip:true };
      var nx = {};
      Object.keys(base).forEach(function(k){ nx[k] = base[k]; });
      nx.exceptions = ex;
      nx.updatedAt = Date.now();
      putSchedule(nx).then(function(ok){ if(ok){ toast('이 날짜만 삭제했습니다'); closeModal(); } });
    }else if(b.id === 'siBase'){
      var sc = state.schedules[form.sid];
      if(sc) openScheduleForm('edit', sc);
    }
  });

  /* 폼: 픽업 */
  $('#pfWho').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b) return;
    pform.requestedBy = b.dataset.who;
    syncPickupWho();
  });
  $('#pfSave').addEventListener('click', savePickup);
  $('#pfCancel').addEventListener('click', closeModal);
  $('#pfRepeat').addEventListener('change', function(){
    pform.repeat.freq = this.value;
    if(pform.repeat.freq === 'weekly' || pform.repeat.freq === 'biweekly'){
      if(!pform.repeat.days.length) pform.repeat.days = [dowOf(pform.date)];
    }
    if(pform.repeat.freq === 'monthly') pform.repeat.day = parseISO(pform.date).getDate();
    syncPickupForm();
  });
  $('#pfWeekdays').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(!b) return;
    var d = Number(b.dataset.dow);
    var i = pform.repeat.days.indexOf(d);
    if(i >= 0) pform.repeat.days.splice(i,1); else pform.repeat.days.push(d);
    pform.daysTouched = true;
    syncPickupForm();
  });
  $('#pfDate').addEventListener('change', function(){
    pform.date = this.value;
    if(pform.repeat.freq === 'monthly') pform.repeat.day = parseISO(pform.date).getDate();
    if(!pform.daysTouched && (pform.repeat.freq === 'weekly' || pform.repeat.freq === 'biweekly')){
      pform.repeat.days = [dowOf(pform.date)];
    }
    syncPickupForm();
  });
  $('#pfExtra').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.id === 'pfDelete'){
      if(!confirm(pform.repeat.freq === 'none'
        ? '픽업 요청을 삭제할까요?'
        : '반복 픽업 전체를 삭제할까요? (모든 날짜 회차가 사라집니다)')) return;
      delPickup(pform.id).then(function(ok){ if(ok){ toast('삭제했습니다'); closeModal(); } });
    }else if(b.id === 'pfInstDelete'){
      var inst = state.pkInsts[pform.id + '|' + pform.baseDate];
      if(!inst) return;
      if(!confirm(md(inst.date) + ' 회차만 반복 픽업에서 뺄까요?')) return;
      skipPickupInstance(inst);
      closeModal();
    }
  });

  /* 범위 선택 시트 */
  $('#scopeActions').addEventListener('click', function(e){
    var b = e.target.closest('button[data-val]');
    if(!b) return;
    closeScope(b.dataset.val);
  });
  $('#scopeClose').addEventListener('click', function(){ closeScope(null); });
  $('#scopeModal').addEventListener('click', function(e){ if(e.target.id === 'scopeModal') closeScope(null); });

  $('#sheetClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function(e){ if(e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && form.open) closeModal(); });

  window.addEventListener('online', function(){ fetchAll(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) fetchAll(); });

  /* ================= 시작 ================= */
  renderAll();
  setConn('connecting');
  startSync();

  /* 디버그용 (테스트/검증) */
  window.__fcs = { state: state, buildInstances: buildInstances, renderAll: renderAll, TODAY: TODAY };
})();
</script>
</body>
</html>
