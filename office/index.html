<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF3E6">
<title>👑 흥장군 비서실 | 성은님 전용</title>
<meta name="description" content="흥장군 비서실 — 성은님 전용 AI 합동작업실. 회의실·작업실·비서현황·메모.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="stylesheet" href="style.css?v=20261126f">
</head>
<body>

<div class="app-shell">

  <header class="app-head">
    <div class="brand">
      <span class="brand-avatar" aria-hidden="true">👑</span>
      <div class="brand-text">
        <h1>흥장군 비서실</h1>
        <p class="owner"><span class="live-dot" aria-hidden="true"></span>성은님 전용</p>
      </div>
    </div>
    <span class="conn is-live" id="connBadge" role="status" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span><span id="connText">실시간 연결</span>
    </span>
  </header>

  <nav class="tabs" id="mainNav" aria-label="주요 메뉴">
    <button type="button" class="tab is-active" data-view="chat" aria-current="page">
      <span class="tab-ico" aria-hidden="true">💬</span><span>회의실</span>
    </button>
    <button type="button" class="tab" data-view="tasks">
      <span class="tab-ico" aria-hidden="true">📋</span><span>작업실</span>
    </button>
    <button type="button" class="tab" data-view="agents">
      <span class="tab-ico" aria-hidden="true">📊</span><span>비서현황</span>
    </button>
    <button type="button" class="tab" data-view="memo">
      <span class="tab-ico" aria-hidden="true">📝</span><span>메모</span>
    </button>
  </nav>

  <main class="app-main">

    <!-- ============ 회의실 ============ -->
    <section class="view is-active" id="view-chat" aria-label="회의실">
      <div class="subtabs" id="chatTabs" role="tablist" aria-label="회의실 채널">
        <button type="button" class="subtab is-active" data-channel="main" role="tab" aria-selected="true">🏛️ 대회의실</button>
        <button type="button" class="subtab" data-channel="command" role="tab" aria-selected="false">🎯 지휘실</button>
        <button type="button" class="subtab" data-channel="lounge" role="tab" aria-selected="false">☕ 라운지</button>
      </div>

      <p class="room-meta" id="roomMeta">🏛️ 대회의실 · ON 3명</p>

      <div class="msg-scroll" id="msgScroll">
        <div class="msg-list" id="msgList"></div>
      </div>

      <div class="composer">
        <div class="chips" id="senderChips" aria-label="발신자 선택">
          <span class="chip-label">발신</span>
          <button type="button" class="chip is-active" data-sender="성은" aria-pressed="true">👑 성은 (대장님)</button>
          <button type="button" class="chip" data-sender="라망이" aria-pressed="false">🔴 라망이</button>
          <button type="button" class="chip" data-sender="꼬맹이" aria-pressed="false">📱 꼬맹이</button>
          <span class="chip-sep" aria-hidden="true"></span>
          <button type="button" class="chip chip-mention" data-mention="@all ">@all</button>
          <button type="button" class="chip chip-mention" data-mention="@라망이 ">@라망이</button>
          <button type="button" class="chip chip-mention" data-mention="@꼬맹이 ">@꼬맹이</button>
        </div>
        <div class="input-row">
          <input id="msgInput" type="text" autocomplete="off" enterkeyhint="send"
                 placeholder="대장님, 지시를 한 줄로 (@all, @라망이, @꼬맹이)" aria-label="메시지 입력">
          <button type="button" class="send-btn" id="sendBtn">보내기</button>
        </div>
      </div>
    </section>

    <!-- ============ 작업실 ============ -->
    <section class="view" id="view-tasks" aria-label="작업실">
      <div class="view-scroll">
        <div class="view-body">

          <div class="stat-strip" id="taskStats">
            <span class="stat stat-pending">대기 <b>0</b></span>
            <span class="stat stat-running">진행 <b>0</b></span>
            <span class="stat stat-done">완료 <b>0</b></span>
          </div>

          <form class="card form-card" id="taskForm">
            <h2 class="card-title">✍️ 새 지시 내리기</h2>
            <input id="taskTitle" type="text" maxlength="120" autocomplete="off"
                   placeholder="예: 꼬맹이에게 인스타 DM 확인 맡기기" aria-label="지시 내용">
            <div class="form-row">
              <select id="taskAssignee" aria-label="담당자">
                <option value="공동">공동</option>
                <option value="라망이">라망이</option>
                <option value="꼬맹이">꼬맹이</option>
              </select>
              <button type="submit" class="primary-btn">지시 추가</button>
            </div>
          </form>

          <div class="list" id="taskList"></div>
        </div>
      </div>
    </section>

    <!-- ============ 비서현황 ============ -->
    <section class="view" id="view-agents" aria-label="비서현황">
      <div class="view-scroll">
        <div class="view-body">
          <p class="section-note">지금 비서실에 앉아 있는 비서들</p>
          <div class="agent-list" id="agentList"></div>
          <div class="card guide-card">
            <h2 class="card-title">🫡 합류 안내</h2>
            <p>꼬맹이(서브폰 피클)가 <b>@gilseongeun8</b> 친구 연결을 마치면, 이 비서실의 <b>작업실</b>과 <b>회의실</b>을 함께 쓰게 됩니다. 지시는 <b>작업실</b>에 올리고, 진행 상황은 <b>회의실</b>에서 확인하세요.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 메모 ============ -->
    <section class="view" id="view-memo" aria-label="메모">
      <div class="view-scroll">
        <div class="view-body">

          <a class="quick-link" href="https://jaginaya1-del.github.io/-/" target="_blank" rel="noopener">
            <span class="ql-ico" aria-hidden="true">🛒</span>
            <span class="ql-text">
              <b>흥장군 핫딜 페이지</b>
              <small>오늘 고른 쿠팡·토스 특가 보러 가기</small>
            </span>
            <span class="ql-arrow" aria-hidden="true">↗</span>
          </a>

          <form class="card form-card" id="memoForm">
            <h2 class="card-title">📝 공용 메모</h2>
            <input id="memoTitle" type="text" maxlength="80" autocomplete="off" placeholder="제목 (예: 이번 주 픽업 일정)" aria-label="메모 제목">
            <textarea id="memoContent" rows="3" maxlength="2000" placeholder="내용을 적어 주세요" aria-label="메모 내용"></textarea>
            <div class="form-row">
              <button type="submit" class="primary-btn">메모 저장</button>
            </div>
          </form>

          <div class="list" id="memoList"></div>
        </div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="app.js?v=20261126f"></script>
</body>
</html>
